version: '3.8'

services:
  parseflow:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=parseflow-production-secret-key-salt
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./storage:/app/storage
    restart: unless-stopped
